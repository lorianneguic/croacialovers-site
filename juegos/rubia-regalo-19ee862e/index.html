const FULL=true;const BUY='https://payhip.com/b/n4NZg';
const QUIZ_N=FULL?8:animals.length, MEM_N=FULL?6:animals.length;
const key=FULL?'rubia_full_progress':'rubia_free_progress';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch{};
const state={stars:saved.stars||0,coins:saved.coins||0,completed:saved.completed||false,idx:0,score:0,question:0,order:[],choices:[],answered:false,memory:[],flipped:[],matched:[],busy:false};
const $=document.getElementById('screen');const store=()=>{try{localStorage.setItem(key,JSON.stringify({stars:state.stars,coins:state.coins,completed:state.completed}))}catch{}};
const track=(n,p)=>{try{gtag('event',n,Object.assign({version:FULL?'completa':'gratis'},p||{}))}catch{}};
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pic=(a)=>'<img alt="'+a.es+'" src="'+a.img+'">';
function play(a){if(!a)return;try{if(window.activeAudio){window.activeAudio.pause();window.activeAudio.currentTime=0}const sound=new Audio(a.audio);window.activeAudio=sound;sound.play().catch(()=>{})}catch{}}
function wallet(){return `<div class="wallet">⭐ ${state.stars} &nbsp; 🪙 ${state.coins}</div>`}
function promo(where){if(FULL)return '';return `<a class="promo" href="${BUY}" target="_blank" rel="noopener" onclick="track('click_comprar_ebook',{lugar:'${where}'})"><strong>📘 Conoce a los 12 amigos de Rubia</strong><small>Con el libro “Los animales” te regalamos esta app completa con los 12 animales, además del audio en cada página, diploma y cuaderno de actividades.</small><span class="btn">Ver el libro →</span></a>`}
let deferredPrompt=null;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;const b=document.getElementById('installBtn');if(b)b.style.display='block'});
function installApp(){if(!deferredPrompt)return;deferredPrompt.prompt();deferredPrompt.userChoice.then(c=>{track('app_instalar',{resultado:c.outcome});deferredPrompt=null;const b=document.getElementById('installBtn');if(b)b.style.display='none'})}
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent), standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
function start(){ $.innerHTML=`<div class="center"><img class="avatar" src="${rubia}" alt="Rubia, la gatita"><h2>¡Hola, soy Rubia!</h2>${FULL?'<div class="gift">🎁 Tu regalo por comprar el libro: ¡los 12 animales!</div>':''}<p>${FULL?'Aprende mis 12 amigos en croata y gana estrellas.':'Aprende 4 animales en croata conmigo y gana estrellas.'}</p><button class="btn full" onclick="worlds()">¡Vamos a jugar! →</button><button id="installBtn" class="btn secondary install" onclick="installApp()">📲 Instalar la app en este celular</button><div class="ioshint" id="iosHint">📲 En iPhone: toca <b>Compartir</b> y luego <b>“Agregar a inicio”</b> para tener a Rubia como app.</div><p class="tiny">${FULL?'Funciona sin internet una vez instalada':'Juego gratis'} · Sin anuncios · Monedas de juego, no dinero real</p></div>`;
 if(deferredPrompt)document.getElementById('installBtn').style.display='block'; if(isIOS&&!standalone)document.getElementById('iosHint').style.display='block'}
function worlds(){ $.innerHTML=`<div class="topline"><h2>Mis aventuras</h2>${wallet()}</div><button class="world" onclick="learn(0)"><span class="emoji">🐱</span><span><strong>Nivel 1 · Amigos de Rubia</strong><small>${animals.length} animales · aprender y jugar ${state.completed?'· ⭐ Completado':''}</small></span></button>${FULL?'':`<div class="world lock"><span class="emoji">🐾</span><span><strong>8 animales más 🔒</strong><small>Vienen de regalo con el libro de Rubia</small><span class="locked">${['🐮','🐬','🐻','🐷','🐔','🐴','🐦','🐧'].map(e=>'<span>'+e+'</span>').join('')}</span></span></div>`}<button class="world" onclick="memoryStart()"><span class="emoji">🧩</span><span><strong>Memorice</strong><small>Encuentra las parejas</small></span></button>${promo('niveles')}<div class="pill">⭐ ${state.stars} estrellas · 🪙 ${state.coins} monedas</div>`}
function learn(i){state.idx=i;let a=animals[i];if(i===0)track('juego_empezar');$.innerHTML=`<div class="topline"><button class="back" onclick="worlds()">← Niveles</button>${wallet()}</div><div class="stage">NIVEL 1 · ANIMAL ${i+1} DE ${animals.length}</div><div class="bar"><div style="width:${(i+1)/animals.length*100}%"></div></div><div class="bigpic">${pic(a)}</div><div class="word">${a.hr}</div><div class="translation">${a.es}</div><div class="row"><button class="btn secondary" onclick="play(animals[${i}])">🔊 Escuchar</button><button class="btn" onclick="${i===animals.length-1?'quizStart()':`learn(${i+1})`}">${i===animals.length-1?'¡A jugar! →':'Siguiente →'}</button></div><p class="tiny center">Toca el altavoz para escuchar cómo se dice en croata.</p>`}
function quizStart(){state.question=0;state.score=0;state.order=shuffle(animals.map((_,i)=>i)).slice(0,QUIZ_N);quiz()}
function quiz(){if(state.question>=state.order.length){return win()}const ti=state.order[state.question];let a=animals[ti];state.answered=false;state.choices=shuffle([a,...shuffle(animals.filter(x=>x!==a)).slice(0,3)]);$.innerHTML=`<div class="topline"><button class="back" onclick="worlds()">← Niveles</button>${wallet()}</div><div class="stage">ESCUCHA Y ESCOGE · ${state.question+1}/${state.order.length}</div><h2 class="center">¿Qué animal escuchas?</h2><div class="row"><button class="btn" onclick="play(animals[${ti}])">🔊 Escuchar palabra</button></div><div class="answers">${state.choices.map((o,i)=>`<button class="answer" id="ans${i}" onclick="answer(${i})">${pic(o)}</button>`).join('')}</div><div class="msg" id="feedback"></div>`;play(a)}
function answer(i){if(state.answered)return;state.answered=true;let a=animals[state.order[state.question]],ok=state.choices[i]===a;document.getElementById('ans'+i).classList.add(ok?'good':'bad');if(ok){state.score++;state.stars++;state.coins+=5;store()}document.getElementById('feedback').textContent=ok?'¡Muy bien! ⭐ +1 estrella · 🪙 +5':'¡Buen intento! Era '+a.hr;setTimeout(()=>{state.question++;quiz()},1100)}
function win(){state.completed=true;store();track('juego_quiz_completo',{aciertos:state.score});$.innerHTML=`<div class="reward">🏆🐱⭐</div><h2 class="center">¡Rubia está feliz!</h2><p class="center">Acertaste ${state.score} de ${state.order.length}.</p><div class="row"><button class="btn" onclick="memoryStart()">Jugar Memorice →</button><button class="btn secondary" onclick="quizStart()">Otra vez</button></div>${promo('quiz')}`}
function memoryStart(){const pick=shuffle(animals).slice(0,MEM_N);state.memory=shuffle([...pick.map((a,i)=>({id:i,type:'img',a})),...pick.map((a,i)=>({id:i,type:'word',a}))]);state.flipped=[];state.matched=[];state.busy=false;memoryRender()}
function memoryRender(){ $.innerHTML=`<div class="topline"><button class="back" onclick="worlds()">← Niveles</button>${wallet()}</div><h2 class="center">🧩 Memorice</h2><p class="center tiny">Encuentra las parejas: imagen y palabra.</p><div class="memory ${MEM_N===4?'m4':''}">${state.memory.map((c,i)=>{let show=state.flipped.includes(i)||state.matched.includes(c.id);return `<button class="tile ${state.matched.includes(c.id)?'done':''}" onclick="flip(${i})">${show?(c.type==='img'?pic(c.a):c.a.hr):'🐾'}</button>`}).join('')}</div>`}
function flip(i){if(state.busy||state.flipped.includes(i)||state.matched.includes(state.memory[i].id))return;state.flipped.push(i);memoryRender();if(state.flipped.length===2){state.busy=true;let [a,b]=state.flipped.map(j=>state.memory[j]);if(a.id===b.id){state.matched.push(a.id);state.stars++;state.coins+=5;store();play(a.a);setTimeout(()=>{state.flipped=[];state.busy=false;if(state.matched.length===MEM_N){track('juego_memorice_completo');$.innerHTML=`<div class="reward">🎉⭐🐱</div><h2 class="center">¡Memorice completado!</h2><p class="center">Ganaste ${MEM_N} estrellas y ${MEM_N*5} monedas.</p><div class="row"><button class="btn secondary" onclick="memoryStart()">Jugar otra vez</button><button class="btn" onclick="worlds()">Ver niveles</button></div>${promo('memorice')}`}else memoryRender()},650)}else{setTimeout(()=>{state.flipped=[];state.busy=false;memoryRender()},1050)}}}
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
start();
</script></body></html>
