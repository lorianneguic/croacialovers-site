const BUY='https://payhip.com/b/n4NZg';
const lockedNames=['krava','dupin','medvjed','svinja','kokoš','konj','ptica','pingvin'];
const key='rubia_free_progress';let saved={};try{saved=JSON.parse(localStorage.getItem(key)||'{}')}catch{};
const state={stars:saved.stars||0,coins:saved.coins||0,completed:saved.completed||false,idx:0,score:0,question:0,order:[],choices:[],answered:false,memory:[],flipped:[],matched:[],busy:false};
const $=document.getElementById('screen');const store=()=>{try{localStorage.setItem(key,JSON.stringify({stars:state.stars,coins:state.coins,completed:state.completed}))}catch{}};
const track=(n,p)=>{try{gtag('event',n,p||{})}catch{}};
const pic=(a)=>'<img alt="'+a.es+'" src="'+a.img+'">';
function play(a){if(!a)return;try{if(window.activeAudio){window.activeAudio.pause();window.activeAudio.currentTime=0}const sound=new Audio(a.audio);window.activeAudio=sound;sound.play().catch(()=>{})}catch{}}
function wallet(){return `<div class="wallet">⭐ ${state.stars} &nbsp; 🪙 ${state.coins}</div>`}
function promo(where){return `<a class="promo" href="${BUY}" target="_blank" rel="noopener" onclick="track('click_comprar_ebook',{lugar:'${where}'})"><strong>📘 Conoce a los 12 amigos de Rubia</strong><small>En el libro “Los animales” hay 8 animales más, con audio en cada página, diploma y cuaderno de actividades de regalo.</small><span class="btn">Ver el libro completo →</span></a>`}
function start(){ $.innerHTML=`<div class="center"><img class="avatar" src="${rubia}" alt="Rubia, la gatita"><h2>¡Hola, soy Rubia!</h2><p>Aprende 4 animales en croata conmigo y gana estrellas.</p><button class="btn full" onclick="worlds()">¡Vamos a jugar! →</button><p class="tiny">Juego gratis · Sin anuncios · Monedas de juego, no dinero real</p></div>`}
function worlds(){ $.innerHTML=`<div class="topline"><h2>Mis aventuras</h2>${wallet()}</div><button class="world" onclick="learn(0)"><span class="emoji">🐱</span><span><strong>Nivel 1 · Amigos de Rubia</strong><small>4 animales · aprender y jugar ${state.completed?'· ⭐ Completado':''}</small></span></button><div class="world lock"><span class="emoji">🐾</span><span><strong>8 animales más 🔒</strong><small>Están en el libro de Rubia</small><span class="locked">${['🐮','🐬','🐻','🐷','🐔','🐴','🐦','🐧'].map(e=>'<span>'+e+'</span>').join('')}</span></span></div>${promo('niveles')}<div class="pill">⭐ ${state.stars} estrellas · 🪙 ${state.coins} monedas</div>`}
function learn(i){state.idx=i;let a=animals[i];if(i===0)track('juego_empezar');$.innerHTML=`<div class="topline"><button class="back" onclick="worlds()">← Niveles</button>${wallet()}</div><div class="stage">NIVEL 1 · ANIMAL ${i+1} DE ${animals.length}</div><div class="bar"><div style="width:${(i+1)/animals.length*100}%"></div></div><div class="bigpic">${pic(a)}</div><div class="word">${a.hr}</div><div class="translation">${a.es}</div><div class="row"><button class="btn secondary" onclick="play(animals[${i}])">🔊 Escuchar</button><button class="btn" onclick="${i===animals.length-1?'quizStart()':`learn(${i+1})`}">${i===animals.length-1?'¡A jugar! →':'Siguiente →'}</button></div><p class="tiny center">Toca el altavoz para escuchar cómo se dice en croata.</p>`}
function quizStart(){state.question=0;state.score=0;state.order=animals.map((_,i)=>i).sort(()=>Math.random()-.5);quiz()}
function quiz(){if(state.question>=animals.length){return win()}let a=animals[state.order[state.question]];state.answered=false;state.choices=[...animals].sort(()=>Math.random()-.5);$.innerHTML=`<div class="topline"><button class="back" onclick="worlds()">← Niveles</button>${wallet()}</div><div class="stage">ESCUCHA Y ESCOGE · ${state.question+1}/${animals.length}</div><h2 class="center">¿Qué animal escuchas?</h2><div class="row"><button class="btn" onclick="play(animals[${state.order[state.question]}])">🔊 Escuchar palabra</button></div><div class="answers">${state.choices.map((o,i)=>`<button class="answer" id="ans${i}" onclick="answer(${i})">${pic(o)}</button>`).join('')}</div><div class="msg" id="feedback"></div>`;play(a)}
function answer(i){if(state.answered)return;state.answered=true;let a=animals[state.order[state.question]],ok=state.choices[i].hr===a.hr;document.getElementById('ans'+i).classList.add(ok?'good':'bad');if(ok){state.score++;state.stars++;state.coins+=5;store()}document.getElementById('feedback').textContent=ok?'¡Muy bien! ⭐ +1 estrella · 🪙 +5':'¡Buen intento! Era '+a.hr;setTimeout(()=>{state.question++;quiz()},1100)}
function win(){state.completed=true;store();track('juego_quiz_completo',{aciertos:state.score});$.innerHTML=`<div class="reward">🏆🐱⭐</div><h2 class="center">¡Rubia está feliz!</h2><p class="center">Acertaste ${state.score} de ${animals.length}.</p><div class="row"><button class="btn" onclick="memoryStart()">Jugar Memorice →</button><button class="btn secondary" onclick="worlds()">Ver niveles</button></div>${promo('quiz')}`}
function memoryStart(){state.memory=[...animals.map((a,i)=>({id:i,type:'img',a})),...animals.map((a,i)=>({id:i,type:'word',a}))].sort(()=>Math.random()-.5);state.flipped=[];state.matched=[];state.busy=false;memoryRender()}
function memoryRender(){ $.innerHTML=`<div class="topline"><button class="back" onclick="worlds()">← Niveles</button>${wallet()}</div><h2 class="center">🧩 Memorice</h2><p class="center tiny">Encuentra las parejas: imagen y palabra.</p><div class="memory">${state.memory.map((c,i)=>{let show=state.flipped.includes(i)||state.matched.includes(c.id);return `<button class="tile ${state.matched.includes(c.id)?'done':''}" onclick="flip(${i})">${show?(c.type==='img'?pic(c.a):c.a.hr):'🐾'}</button>`}).join('')}</div>`}
function flip(i){if(state.busy||state.flipped.includes(i)||state.matched.includes(state.memory[i].id))return;state.flipped.push(i);memoryRender();if(state.flipped.length===2){state.busy=true;let [a,b]=state.flipped.map(j=>state.memory[j]);if(a.id===b.id){state.matched.push(a.id);state.stars++;state.coins+=5;store();play(a.a);setTimeout(()=>{state.flipped=[];state.busy=false;if(state.matched.length===animals.length){track('juego_memorice_completo');$.innerHTML=`<div class="reward">🎉⭐🐱</div><h2 class="center">¡Memorice completado!</h2><p class="center">Ganaste ${animals.length} estrellas y ${animals.length*5} monedas.</p><div class="row"><button class="btn secondary" onclick="memoryStart()">Jugar otra vez</button></div>${promo('memorice')}`}else memoryRender()},650)}else{setTimeout(()=>{state.flipped=[];state.busy=false;memoryRender()},1050)}}}
start();
</script></body></html>
