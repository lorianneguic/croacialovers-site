function makeOptions(p,reverse=false){if(reverse)return shuffle([p[0],...shuffle(DATA[w].words.filter(x=>x[0]!==p[0])).slice(0,3).map(x=>x[0])]).map(v=>`<button class="option" data-value="${encodeURIComponent(v)}" onclick="answer(this,true)">${v}</button>`).join('');let target=reverse?p[0]:tr(p);return optionsFor(p,reverse).map(v=>`<button class="option" data-value="${encodeURIComponent(v)}" onclick="answer(this,${reverse})">${v}</button>`).join('')}
function choose(){let d=DATA[w].words;if(index>=d.length){$('activity').innerHTML=`<div class="banner"><h2>${T().chooseDone}</h2><p>${T().chooseDoneText}</p><button class="primary" onclick="nextStage()">${T().toMemory}</button></div>`;return}let p=d[index];answerLocked=false;$('activity').innerHTML=`<div class="progress"><div style="width:${index/d.length*100}%"></div></div><p>${T().meaning}</p><div class="study-word">${p[0]}</div><button class="secondary" onclick="say(DATA[w].words[index][0])">${T().listen}</button><div class="options">${makeOptions(p)}</div><div class="feedback" id="feedback"></div><div id="continue"></div>`}
function answer(btn,final){if(answerLocked)return;let p=(final?challengeSet:DATA[w].words)[index],val=decodeURIComponent(btn.dataset.value),target=final?p[0]:tr(p);if(val===target){answerLocked=true;sfx('ok');btn.classList.add('good');$('feedback').textContent=T().correct;score+=10;$('continue').innerHTML=`<button class="primary" onclick="index++;${final?'challenge()':'choose()'}">${T().continue}</button>`}else{sfx('bad');btn.classList.add('bad');btn.disabled=true;$('feedback').textContent=T().retry}updateScore()}
function updateScore(){$('worldLabel').textContent=`${DATA[w].icon} ${T().world}: ${T().names[w]} · ${score} ${T().points}`}
function startMemory(){let d=shuffle(DATA[w].words).slice(0,5);mem=shuffle(d.flatMap((p,i)=>[{id:i,txt:p[0]},{id:i,img:p[0]}]));d.forEach(p=>{new Image().src='img/'+slug(p[0])+'.webp'});selected=[];matched=0;memBusy=false;drawMemory()}
function drawMemory(){let cards=mem.map((c,i)=>`<button class="tile ${c.done?'matched':selected.includes(i)?'':'hidden'}" onclick="flip(${i})" ${c.done?'disabled':''}>${c.done||selected.includes(i)?(c.img?pic(c.img,'mem-img'):c.txt):'✦'}</button>`).join('');$('activity').innerHTML=`<p>${T().memoryHelp}</p><div class="memory">${cards}</div><div class="feedback">${T().pairs}: ${matched}/5</div>${matched===5?`<button class="primary" onclick="nextStage()">${T().toMatch}</button>`:''}`}
function flip(i){if(memBusy||mem[i].done||selected.includes(i)||selected.length>=2)return;selected.push(i);drawMemory();if(selected.length===2){let[a,b]=selected;if(mem[a].id===mem[b].id){sfx('ok');mem[a].done=mem[b].done=true;score+=15;matched++;selected=[];drawMemory();updateScore()}else{sfx('bad');memBusy=true;setTimeout(()=>{selected=[];memBusy=false;if(stage===2)drawMemory()},850)}}}
function startMatching(){matchPairs=shuffle(DATA[w].words).slice(0,5).map((p,i)=>({id:i,hr:p[0],translation:tr(p)}));matchDone=new Set();matchPick=null;matchRight=shuffle(matchPairs);if(matchRight.length>1){let attempts=0;while(matchRight.some((p,i)=>p.id===matchPairs[i].id)&&attempts++<100)matchRight=shuffle(matchPairs);if(matchRight.some((p,i)=>p.id===matchPairs[i].id))matchRight=matchPairs.slice(1).concat(matchPairs[0]);}drawMatching()}
function drawMatching(){let column=(items,side)=>items.map(p=>`<button class="match-item ${matchDone.has(p.id)?'gone':''} ${matchPick&&matchPick.side===side&&matchPick.id===p.id?'picked':''}" onclick="pickMatch('${side}',${p.id})" ${matchDone.has(p.id)?'disabled':''}>${side==='hr'?p.hr:p.translation}</button>`).join('');$('activity').innerHTML=`<p>${T().matchHelp}</p><div class="match-columns"><div><div class="match-heading">🇭🇷 HRVATSKI</div>${column(matchPairs,'hr')}</div><div><div class="match-heading">${lang==='es'?'🇪🇸 ESPAÑOL':'🇬🇧 ENGLISH'}</div>${column(matchRight,'translation')}</div></div><div class="feedback" id="feedback">${T().found}: ${matchDone.size}/5</div>${matchDone.size===5?`<div class="banner"><h2>${T().excellent}</h2><button class="primary" onclick="nextStage()">${T().toChallenge}</button></div>`:''}`}
function pickMatch(side,id){if(matchDone.has(id))return;if(!matchPick){matchPick={side,id};drawMatching();return}if(matchPick.side===side){matchPick={side,id};drawMatching();return}if(matchPick.id===id){sfx('ok');matchDone.add(id);score+=15;matchPick=null;drawMatching();updateScore()}else{sfx('bad');matchPick=null;drawMatching();$('feedback').textContent=T().mismatch}}
let challengeSet=[];
function challenge(){if(index===0&&!challengeSet.length)challengeSet=shuffle(DATA[w].words).slice(0,5);let d=challengeSet;if(index>=5){$('activity').innerHTML=`<div class="banner"><h2>${T().passed}</h2><p>${T().passedText}</p><button class="primary" onclick="nextStage()">${T().result}</button></div>`;return}let p=d[index];answerLocked=false;$('activity').innerHTML=`<div class="progress"><div style="width:${index/5*100}%"></div></div><p>${T().challenge} ${index+1}/5 · ${T().challengeHelp}</p><div class="study-illustration small">${pic(p[0])}</div><h2 style="margin-top:15px">${tr(p)}</h2><div class="options">${makeOptions(p,true)}</div><div class="feedback" id="feedback"></div><div id="continue"></div>`}
function complete(){sfx('ok');try{gtag('event','juego_completo',{juego:'croata_practico',mundo:DATA[w].icon})}catch(e){}$('activity').innerHTML=`<div style="text-align:center;padding:22px 5px"><div style="font-size:76px">🏆</div><h2>${T().bravo} ${T().names[w]}</h2><p>${T().yourScore} <strong style="color:#ffdf8c">${score} ${T().points}</strong></p><p>${T().demoNote}</p><div class="row" style="justify-content:center"><button class="secondary" onclick="openWorld(w)">${T().repeatWorld}</button><button class="primary" onclick="goHome()">${T().nextWorld}</button></div></div>`}
let deferredPrompt=null;
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent),standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone;
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;$('installBtn').style.display='inline-block'});
function installApp(){if(!deferredPrompt)return;deferredPrompt.prompt();deferredPrompt.userChoice.then(c=>{try{gtag('event','app_instalar',{juego:'croata_practico',resultado:c.outcome})}catch(e){}deferredPrompt=null;$('installBtn').style.display='none'})}
if(isIOS&&!standalone)$('iosHint').style.display='block';
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
setLanguage('es');
</script></body></html>
