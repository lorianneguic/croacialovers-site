<style>
:root {
  --red:#c8102e; --red-d:#9e0c24; --ink:#2b1416; --soft:#6b4f52; --line:#f1d9dc; --chip:#fde8eb;
  --paper:#fff7f7; --gold:#ffd666; --ok:#1f9d55; --bad:#d64545;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  color-scheme: light;
}
* { box-sizing:border-box; }
html,body { margin:0; }
body { background:#fff; color:var(--ink); font-family:var(--body); font-size:1.05rem; line-height:1.5; -webkit-tap-highlight-color:transparent; }
button { font:inherit; color:inherit; cursor:pointer; }
.app { max-width:34rem; margin:0 auto; min-height:100dvh; display:flex; flex-direction:column; }
.bar { display:flex; align-items:center; gap:10px; padding:14px 16px; }
.bar a.brand { display:flex; align-items:center; gap:8px; text-decoration:none; color:inherit; font-family:var(--display); font-weight:800; }
.bar img { border-radius:50%; }
.bar .sp { flex:1; }
.stars { font-weight:700; background:var(--chip); color:var(--red); padding:4px 12px; border-radius:99px; font-size:.95rem; }
.back { border:0; background:var(--chip); color:var(--red); font-weight:800; border-radius:99px; padding:6px 14px; }
main { flex:1; padding:4px 16px 28px; }
h1,h2,h3 { font-family:var(--display); line-height:1.08; margin:0; letter-spacing:-.02em; }
.eyebrow { font-family:var(--display); font-weight:700; font-size:.78rem; letter-spacing:.14em; text-transform:uppercase; color:var(--red); }

/* portada */
.hero { background:var(--red); color:#fff; border-radius:24px; padding:22px 20px 20px; position:relative; overflow:hidden;
  background-image: conic-gradient(from 0deg, #c8102e 0 25%, #b40e29 0 50%, #c8102e 0 75%, #b40e29 0); background-size:44px 44px; }
.hero .eyebrow { color:var(--gold); }
.hero-img { display:block; width:calc(100% + 40px); margin:-22px -20px 16px; height:auto; aspect-ratio:1/1; object-fit:cover; object-position:center 30%; max-height:340px; }
.hero h1 { font-size:clamp(1.9rem, 8vw, 2.5rem); margin:6px 0 8px; }
.hero p { margin:0; color:#ffe9ec; }
.bubble { display:inline-block; background:#fff; color:var(--ink); font-family:var(--display); font-weight:800; padding:8px 14px; border-radius:18px 18px 18px 4px; margin-top:14px; box-shadow:0 6px 16px -8px rgba(0,0,0,.5); }
.menu { display:grid; gap:12px; margin-top:18px; }
.mbtn { display:flex; align-items:center; gap:14px; text-align:left; border:2px solid var(--line); background:#fff; border-radius:18px; padding:14px 16px; transition:transform .15s, border-color .15s; }
.mbtn:hover { transform:translateY(-2px); border-color:var(--red); }
.mbtn .ic { font-size:1.9rem; width:52px; height:52px; display:grid; place-items:center; background:var(--chip); border-radius:14px; flex:none; }
.mbtn b { display:block; font-family:var(--display); font-size:1.12rem; }
.mbtn small { color:var(--soft); font-size:.92rem; }
.mbtn .done { margin-left:auto; font-size:1.3rem; }
.note { color:var(--soft); font-size:.9rem; margin-top:16px; text-align:center; }

/* tarjetas y botones */
.card { background:var(--paper); border:2px solid var(--line); border-radius:22px; padding:22px 18px; text-align:center; }
.hr { font-family:var(--display); font-weight:800; font-size:clamp(1.7rem, 7.5vw, 2.3rem); color:var(--red); }
.es { color:var(--soft); font-size:1.1rem; margin-top:4px; }
.say { margin-top:14px; font-size:.95rem; color:var(--ink); background:#fff; border-radius:12px; padding:8px 12px; display:inline-block; border:1px dashed var(--line); }
.big { display:inline-flex; align-items:center; justify-content:center; gap:8px; border:0; background:var(--red); color:#fff; font-weight:800; border-radius:99px; padding:13px 22px; font-size:1.05rem; }
.big.ghost { background:#fff; color:var(--red); border:2px solid var(--red); }
.big:active { transform:scale(.97); }
.row { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:16px; }
.spk { width:74px; height:74px; border-radius:50%; border:0; background:var(--red); color:#fff; font-size:2rem; box-shadow:0 10px 24px -10px rgba(200,16,46,.7); }
.spk.playing { animation:pop .5s ease; }
.prog { height:8px; background:var(--chip); border-radius:99px; overflow:hidden; margin:2px 0 16px; }
.prog i { display:block; height:100%; background:var(--red); border-radius:99px; transition:width .3s; }
.q { font-family:var(--display); font-weight:800; font-size:1.3rem; text-align:center; margin:6px 0 14px; }
.opts { display:grid; gap:10px; margin-top:16px; }
.opt { border:2px solid var(--line); background:#fff; border-radius:16px; padding:14px 16px; text-align:left; font-weight:600; transition:border-color .15s, background .15s; }
.opt:hover { border-color:var(--red); }
.opt.ok { background:#e7f7ee; border-color:var(--ok); }
.opt.bad { background:#fdeaea; border-color:var(--bad); animation:shake .35s; }
.opt[disabled] { cursor:default; }
.fb { min-height:1.6em; text-align:center; font-weight:700; margin-top:12px; }
.fb.ok { color:var(--ok); } .fb.bad { color:var(--bad); }

/* armar frase */
.slot { min-height:62px; border:2px dashed var(--line); border-radius:16px; padding:10px; display:flex; flex-wrap:wrap; gap:8px; align-items:center; justify-content:center; background:var(--paper); }
.tiles { display:flex; flex-wrap:wrap; gap:8px; justify-content:center; margin-top:14px; }
.tile { border:0; background:#fff; border:2px solid var(--red); color:var(--red); font-weight:800; border-radius:12px; padding:9px 14px; font-size:1.1rem; }
.slot .tile { background:var(--red); color:#fff; }
.slot.ok { border-color:var(--ok); background:#e7f7ee; }
.slot.bad { border-color:var(--bad); animation:shake .35s; }

/* conversación */
.chat { display:grid; gap:10px; margin-bottom:6px; }
.msg { max-width:85%; padding:10px 14px; border-radius:18px; font-weight:600; }
.msg.them { background:var(--chip); justify-self:start; border-bottom-left-radius:4px; }
.msg.me { background:var(--red); color:#fff; justify-self:end; border-bottom-right-radius:4px; }
.msg small { display:block; font-weight:400; opacity:.8; font-size:.85rem; }
.who { font-size:.8rem; color:var(--soft); font-weight:700; }

/* mi presentación */
label { display:block; font-weight:700; margin:14px 0 6px; }
input, select { width:100%; font:inherit; padding:12px 14px; border:2px solid var(--line); border-radius:14px; background:#fff; }
input:focus, select:focus { outline:none; border-color:var(--red); }
.pres { margin-top:18px; background:#fff; border:3px solid var(--red); border-radius:22px; padding:18px; position:relative; }
.pres p { margin:0 0 8px; }
.pres .l { display:flex; gap:10px; align-items:baseline; }
.pres .l button { border:0; background:var(--chip); color:var(--red); border-radius:50%; width:34px; height:34px; flex:none; }
.pres .l b { color:var(--red); font-family:var(--display); font-size:1.2rem; }
.pres .l small { display:block; color:var(--soft); }
.end { text-align:center; }
.end .medal { font-size:4rem; animation:pop .6s ease; }
.cta { margin-top:20px; background:linear-gradient(135deg,#fff3c4,#ffd6b8); border-radius:20px; padding:18px; text-align:center; }
.cta p { margin:6px 0 12px; color:var(--soft); }
.cta a { text-decoration:none; }
footer { text-align:center; color:var(--soft); font-size:.85rem; padding:16px; border-top:1px solid var(--line); }
footer a { color:var(--red); }
.hide { display:none !important; }
@keyframes pop { 0%{transform:scale(.6)} 60%{transform:scale(1.12)} 100%{transform:scale(1)} }
@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
.confetti { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:9; }
.confetti i { position:absolute; top:-12px; width:10px; height:14px; border-radius:2px; animation:fall 1.6s ease-in forwards; }
@keyframes fall { to { transform:translateY(105vh) rotate(540deg); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation:none !important; transition:none !important; } }
</style>
</head>

<script>
const P = [
  {a:'bok', hr:'Bok!', es:'¡Hola! (informal)', tip:'Se dice: bok'},
  {a:'dobar-dan', hr:'Dobar dan!', es:'¡Buenos días! / ¡Buenas tardes!', tip:'Más formal. Se dice: dóbar dan'},
  {a:'kako-se-zoves', hr:'Kako se zoveš?', es:'¿Cómo te llamas?', tip:'La š suena como "sh": zóvesh'},
  {a:'zovem-se-ana', hr:'Zovem se Ana.', es:'Me llamo Ana.', tip:'Cambia "Ana" por tu nombre'},
  {a:'drago-mi-je', hr:'Drago mi je.', es:'Mucho gusto.', tip:'Literalmente: "me es grato"'},
  {a:'i-meni', hr:'I meni.', es:'Igualmente. (A mí también)', tip:'Respuesta a "Drago mi je"'},
  {a:'a-ti', hr:'A ti?', es:'¿Y tú?', tip:'Para devolver la pregunta'},
  {a:'odakle-si', hr:'Odakle si?', es:'¿De dónde eres?', tip:'Se dice: ódakle si'},
  {a:'iz-cilea', hr:'Ja sam iz Čilea.', es:'Soy de Chile.', tip:'La č suena como "ch"'},
  {a:'gdje-zivis', hr:'Gdje živiš?', es:'¿Dónde vives?', tip:'La ž suena como una "y" fuerte, como la "j" francesa'},
  {a:'zivim-u-santiagu', hr:'Živim u Santiagu.', es:'Vivo en Santiago.', tip:'Después de "u" la ciudad cambia: Santiago → Santiagu'},
  {a:'koliko-godina', hr:'Koliko imaš godina?', es:'¿Cuántos años tienes?', tip:'Literalmente: "¿cuántos años tienes?"'},
  {a:'trideset-godina', hr:'Imam trideset godina.', es:'Tengo treinta años.', tip:'imam = tengo'},
  {a:'govoris-li', hr:'Govoriš li hrvatski?', es:'¿Hablas croata?', tip:'hrvatski = croata'},
  {a:'govorim-malo', hr:'Govorim malo hrvatski.', es:'Hablo un poco de croata.', tip:'¡La frase más útil de todas! 😉'},
  {a:'djed', hr:'Moj djed je iz Hrvatske.', es:'Mi abuelo es de Croacia.', tip:'djed = abuelo'},
  {a:'baka', hr:'Moja baka je iz Hrvatske.', es:'Mi abuela es de Croacia.', tip:'baka = abuela'},
  {a:'volim-hrvatsku', hr:'Volim Hrvatsku!', es:'¡Me encanta Croacia!', tip:'volim = amo, me encanta'},
  {a:'vidimo-se', hr:'Vidimo se!', es:'¡Nos vemos!', tip:'Para despedirte'}
];
const BUILD = [
  {hr:'Zovem se Ana', a:'zovem-se-ana', es:'Me llamo Ana.'},
  {hr:'Ja sam iz Čilea', a:'iz-cilea', es:'Soy de Chile.'},
  {hr:'Živim u Santiagu', a:'zivim-u-santiagu', es:'Vivo en Santiago.'},
  {hr:'Govorim malo hrvatski', a:'govorim-malo', es:'Hablo un poco de croata.'},
  {hr:'Moj djed je iz Hrvatske', a:'djed', es:'Mi abuelo es de Croacia.'},
  {hr:'Koliko imaš godina', a:'koliko-godina', es:'¿Cuántos años tienes?'}
];
const CHAT = [
  {q:'bok-kako-se-zoves', qhr:'Bok! Kako se zoveš?', qes:'¡Hola! ¿Cómo te llamas?', ok:'Zovem se Ana.', okes:'Me llamo Ana.', okA:'zovem-se-ana', bad:['Imam trideset godina.','Volim Hrvatsku!']},
  {q:'drago-mi-je', qhr:'Drago mi je.', qes:'Mucho gusto.', ok:'I meni.', okes:'Igualmente.', okA:'i-meni', bad:['Odakle si?','Vidimo se!']},
  {q:'odakle-si', qhr:'Odakle si?', qes:'¿De dónde eres?', ok:'Ja sam iz Čilea.', okes:'Soy de Chile.', okA:'iz-cilea', bad:['Zovem se Ana.','Govorim malo hrvatski.']},
  {q:'gdje-zivis', qhr:'Gdje živiš?', qes:'¿Dónde vives?', ok:'Živim u Santiagu.', okes:'Vivo en Santiago.', okA:'zivim-u-santiagu', bad:['Dobar dan!','Moja baka je iz Hrvatske.']},
  {q:'koliko-godina', qhr:'Koliko imaš godina?', qes:'¿Cuántos años tienes?', ok:'Imam trideset godina.', okes:'Tengo treinta años.', okA:'trideset-godina', bad:['Ja sam iz Čilea.','I meni.']},
  {q:'govoris-li', qhr:'Govoriš li hrvatski?', qes:'¿Hablas croata?', ok:'Govorim malo hrvatski.', okes:'Hablo un poco de croata.', okA:'govorim-malo', bad:['Gdje živiš?','Zovem se Ana.']},
  {q:'vidimo-se', qhr:'Vidimo se!', qes:'¡Nos vemos!', ok:'Bok!', okes:'¡Chao!', okA:'bok', bad:['Kako se zoveš?','Imam trideset godina.']}
];
const COUNTRIES = [
  ['Chile','Čilea','iz-cilea'],['Argentina','Argentine','c-argentine'],['Perú','Perua','c-perua'],['México','Meksika','c-meksika'],
  ['España','Španjolske','c-spanjolske'],['Colombia','Kolumbije','c-kolumbije'],['Uruguay','Urugvaja','c-urugvaja'],
  ['Venezuela','Venezuele','c-venezuele'],['Bolivia','Bolivije','c-bolivije'],['Ecuador','Ekvadora','c-ekvadora'],['Paraguay','Paragvaja','c-paragvaja']
];
const GAMES = [
  {id:'learn', ic:'📖', t:'1. Aprende las frases', s:'Escucha y repite 19 frases'},
  {id:'listen', ic:'👂', t:'2. Escucha y elige', s:'¿Qué significa lo que oyes?'},
  {id:'build', ic:'🧩', t:'3. Arma la frase', s:'Ordena las palabras en croata'},
  {id:'chat', ic:'💬', t:'4. Conversa con Marko', s:'Responde como en Croacia'},
  {id:'me', ic:'🪪', t:'5. Tu presentación', s:'Crea tu presentación en croata'}
];

const $ = s => document.querySelector(s);
const view = $('#view'), backBtn = $('#back'), starsEl = $('#stars');
const store = { get(k,d){ try{ const v=localStorage.getItem('cl-pres-'+k); return v===null?d:JSON.parse(v);}catch(e){return d;} },
                set(k,v){ try{ localStorage.setItem('cl-pres-'+k, JSON.stringify(v)); }catch(e){} } };
let stars = store.get('stars',0), done = store.get('done',{});
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

let player = new Audio();
function play(slug, btn){
  try { player.pause(); player = new Audio('audio/'+slug+'.mp3'); player.play().catch(()=>{}); } catch(e){}
  if(btn){ btn.classList.remove('playing'); void btn.offsetWidth; btn.classList.add('playing'); }
  return player;
}
function playSeq(list){ let i=0; const next=()=>{ if(i>=list.length) return; const p=play(list[i++]); p.onended=()=>setTimeout(next,250); }; next(); }
function sfx(ok){ try{ const a=new Audio('sfx/'+(ok?'acierto':'error')+'.mp3'); a.volume=.5; a.play().catch(()=>{});}catch(e){} }
function addStar(n=1){ stars+=n; store.set('stars',stars); starsEl.textContent='⭐ '+stars; }
function finish(id){ done[id]=true; store.set('done',done); try{ gtag('event','juego_completado',{juego:'presentate_'+id}); }catch(e){} }
function confetti(){ const c=document.createElement('div'); c.className='confetti'; const cols=['#c8102e','#ffd666','#1f9d55','#ff8a1f','#2b6cb0'];
  for(let i=0;i<60;i++){ const p=document.createElement('i'); p.style.left=Math.random()*100+'vw'; p.style.background=cols[i%5]; p.style.animationDelay=Math.random()*.6+'s'; c.appendChild(p);} document.body.appendChild(c); setTimeout(()=>c.remove(),2600); }
starsEl.textContent='⭐ '+stars;
backBtn.onclick = () => go('home');

function go(id){
  backBtn.classList.toggle('hide', id==='home');
  window.scrollTo(0,0);
  ({home, learn, listen, build, chat, me}[id])();
  if(id!=='home') try{ gtag('event','juego_abierto',{juego:'presentate_'+id}); }catch(e){}
}

function home(){
  view.innerHTML = `
    <section class="hero">
      <img class="hero-img" src="img-lory-split.webp" alt="Lory de Croacia Lovers saludando en la Riva de Split" width="900" height="900">
      <span class="eyebrow">Gratis · con audio · nivel inicial</span>
      <h1>Preséntate en croata 🇭🇷</h1>
      <p>Aprende a decir tu nombre, de dónde eres y que tu familia es de Croacia. Después, ¡practica conversando!</p>
      <span class="bubble">Bok! Zovem se Lory. Drago mi je! 👋</span>
    </section>
    <div class="menu">${GAMES.map(g=>`
      <button class="mbtn" type="button" data-go="${g.id}">
        <span class="ic" aria-hidden="true">${g.ic}</span>
        <span><b>${g.t}</b><small>${g.s}</small></span>
        <span class="done" aria-label="${done[g.id]?'Completado':''}">${done[g.id]?'✅':''}</span>
      </button>`).join('')}
    </div>
    <p class="note">🔊 Sube el volumen. Funciona en el celular, sin descargar nada.</p>`;
  view.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(b.dataset.go));
}

function learn(){
  let i=0;
  const draw=()=>{
    const p=P[i];
    view.innerHTML = `
      <div class="prog"><i style="width:${(i+1)/P.length*100}%"></i></div>
      <p class="eyebrow" style="text-align:center">Frase ${i+1} de ${P.length}</p>
      <div class="card">
        <button class="spk" id="spk" type="button" aria-label="Escuchar">🔊</button>
        <div class="hr" lang="hr" style="margin-top:14px">${esc(p.hr)}</div>
        <div class="es">${esc(p.es)}</div>
        <div class="say">💡 ${esc(p.tip)}</div>
      </div>
      <p class="note">Escucha y repite en voz alta 🗣️</p>
      <div class="row">
        <button class="big ghost" id="prev" type="button" ${i===0?'disabled style="opacity:.4"':''}>←</button>
        <button class="big" id="next" type="button">${i===P.length-1?'¡Terminé! ✅':'Siguiente →'}</button>
      </div>`;
    const spk=$('#spk'); spk.onclick=()=>play(p.a,spk); play(p.a,spk);
    $('#prev').onclick=()=>{ if(i>0){i--;draw();} };
    $('#next').onclick=()=>{ if(i<P.length-1){i++;draw();} else { addStar(3); finish('learn'); endScreen('¡Ya conoces las 19 frases!', 3, 'listen'); } };
  };
  draw();
}

function listen(){
  const qs=shuffle(P).slice(0,10); let i=0, score=0;
  const draw=()=>{
    const p=qs[i];
    const opts=shuffle([p, ...shuffle(P.filter(x=>x!==p && x.es!==p.es)).slice(0,3)]);
    view.innerHTML = `
      <div class="prog"><i style="width:${i/qs.length*100}%"></i></div>
      <p class="q">¿Qué significa?</p>
      <div style="text-align:center"><button class="spk" id="spk" type="button" aria-label="Escuchar otra vez">🔊</button></div>
      <div class="opts">${opts.map((o,k)=>`<button class="opt" type="button" data-k="${k}">${esc(o.es)}</button>`).join('')}</div>
      <div class="fb" id="fb"></div>`;
    const spk=$('#spk'); spk.onclick=()=>play(p.a,spk); setTimeout(()=>play(p.a,spk),200);
    view.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const o=opts[+b.dataset.k], ok=o===p;
      view.querySelectorAll('.opt').forEach(x=>x.disabled=true);
      b.classList.add(ok?'ok':'bad'); sfx(ok);
      if(!ok) view.querySelectorAll('.opt')[opts.indexOf(p)].classList.add('ok');
      $('#fb').className='fb '+(ok?'ok':'bad');
      $('#fb').innerHTML = ok ? '¡Muy bien! Bravo! 🎉' : `Era: <span lang="hr">${esc(p.hr)}</span> = ${esc(p.es)}`;
      if(ok){ score++; addStar(); }
      setTimeout(()=>{ i++; if(i<qs.length) draw(); else { finish('listen'); endScreen(`Acertaste ${score} de ${qs.length}`, score, 'build'); } }, ok?1100:2200);
    });
  };
  draw();
}

function build(){
  const qs=shuffle(BUILD); let i=0, score=0;
  const draw=()=>{
    const s=qs[i], words=s.hr.split(' '); let picked=[];
    let pool=shuffle(words.map((w,k)=>({w,k}))); if(pool.map(x=>x.w).join(' ')===s.hr && words.length>1) pool=pool.reverse();
    view.innerHTML = `
      <div class="prog"><i style="width:${i/qs.length*100}%"></i></div>
      <p class="q">Arma en croata:<br><span style="color:var(--red)">“${esc(s.es)}”</span></p>
      <div class="slot" id="slot" aria-label="Tu frase"></div>
      <div class="tiles" id="tiles"></div>
      <div class="fb" id="fb"></div>
      <div class="row"><button class="big ghost" id="clear" type="button">Borrar</button><button class="big" id="check" type="button">Revisar ✔</button></div>`;
    const slot=$('#slot'), tiles=$('#tiles');
    const paint=()=>{
      slot.innerHTML = picked.map((t,k)=>`<button class="tile" type="button" lang="hr" data-k="${k}">${esc(t.w)}</button>`).join('') || '<span style="color:var(--soft)">Toca las palabras en orden 👇</span>';
      tiles.innerHTML = pool.filter(t=>!picked.includes(t)).map(t=>`<button class="tile" type="button" lang="hr" data-id="${t.k}">${esc(t.w)}</button>`).join('');
      slot.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{ picked.splice(+b.dataset.k,1); paint(); });
      tiles.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{ picked.push(pool.find(t=>t.k===+b.dataset.id)); paint(); });
    };
    paint();
    $('#clear').onclick=()=>{ picked=[]; slot.className='slot'; paint(); };
    $('#check').onclick=()=>{
      if(picked.length<words.length){ $('#fb').className='fb bad'; $('#fb').textContent='Faltan palabras 🙂'; return; }
      const ok=picked.map(t=>t.w).join(' ')===s.hr;
      slot.className='slot '+(ok?'ok':'bad'); sfx(ok);
      $('#fb').className='fb '+(ok?'ok':'bad');
      $('#fb').innerHTML = ok ? '¡Perfecto! 🎉' : `Era: <span lang="hr">${esc(s.hr)}</span>`;
      if(ok){ score++; addStar(); }
      $('#check').disabled=true; $('#clear').disabled=true;
      const p=play(s.a);
      setTimeout(()=>{ i++; if(i<qs.length) draw(); else { finish('build'); endScreen(`Armaste ${score} de ${qs.length} frases`, score, 'chat'); } }, 2300);
    };
  };
  draw();
}

function chat(){
  let i=0, score=0; const log=[];
  const draw=()=>{
    const c=CHAT[i];
    const opts=shuffle([c.ok, ...c.bad]);
    view.innerHTML = `
      <div class="prog"><i style="width:${i/CHAT.length*100}%"></i></div>
      <p class="eyebrow" style="text-align:center">Estás en un café de Split ☕ y conoces a Marko</p>
      <div class="chat" id="chat">${log.join('')}
        <div class="who">Marko</div>
        <div class="msg them"><span lang="hr">${esc(c.qhr)}</span> <button class="back" style="padding:2px 9px;margin-left:4px" id="rep" type="button" aria-label="Escuchar">🔊</button><small>${esc(c.qes)}</small></div>
      </div>
      <p class="q" style="font-size:1.05rem;margin-top:16px">¿Qué le respondes?</p>
      <div class="opts">${opts.map((o,k)=>`<button class="opt" type="button" lang="hr" data-k="${k}">${esc(o)}</button>`).join('')}</div>
      <div class="fb" id="fb"></div>`;
    $('#rep').onclick=()=>play(c.q); setTimeout(()=>play(c.q),200);
    const last=view.querySelector('#chat .msg:last-child'); last && last.scrollIntoView({block:'nearest'});
    view.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const ok=opts[+b.dataset.k]===c.ok;
      view.querySelectorAll('.opt').forEach(x=>x.disabled=true);
      b.classList.add(ok?'ok':'bad'); sfx(ok);
      if(!ok) view.querySelectorAll('.opt')[opts.indexOf(c.ok)].classList.add('ok');
      $('#fb').className='fb '+(ok?'ok':'bad');
      $('#fb').innerHTML = ok ? '¡Bien dicho! 👏' : `Mejor: <span lang="hr">${esc(c.ok)}</span> (${esc(c.okes)})`;
      if(ok){ score++; addStar(); }
      setTimeout(()=>play(c.okA), 500);
      log.push(`<div class="who">Marko</div><div class="msg them"><span lang="hr">${esc(c.qhr)}</span><small>${esc(c.qes)}</small></div><div class="msg me"><span lang="hr">${esc(c.ok)}</span><small>${esc(c.okes)}</small></div>`);
      setTimeout(()=>{ i++; if(i<CHAT.length) draw(); else { finish('chat'); endScreen(`Respondiste bien ${score} de ${CHAT.length}`, score, 'me'); } }, ok?2000:2800);
    });
  };
  draw();
}

function me(){
  const saved=store.get('me',{name:'',country:'Chile',family:'djed'});
  view.innerHTML = `
    <h2 style="font-size:1.6rem">Tu presentación en croata 🪪</h2>
    <p style="color:var(--soft);margin:6px 0 0">Escribe tu nombre y elige tu país. Te armo tu presentación para que la practiques.</p>
    <label for="nm">Tu nombre</label>
    <input id="nm" maxlength="30" autocomplete="given-name" placeholder="Por ejemplo: Ana" value="${esc(saved.name)}">
    <label for="ct">Tu país</label>
    <select id="ct">${COUNTRIES.map(c=>`<option ${c[0]===saved.country?'selected':''}>${c[0]}</option>`).join('')}</select>
    <label for="fm">¿Quién de tu familia es de Croacia?</label>
    <select id="fm">
      <option value="djed">Mi abuelo</option><option value="baka">Mi abuela</option><option value="none">Nadie, ¡pero me encanta Croacia!</option>
    </select>
    <div class="pres" id="pres"></div>
    <div class="row"><button class="big" id="all" type="button">▶ Escuchar todo</button></div>`;
  $('#fm').value=saved.family;
  const draw=()=>{
    const name=$('#nm').value.trim()||'Ana', c=COUNTRIES.find(x=>x[0]===$('#ct').value), fam=$('#fm').value;
    store.set('me',{name:$('#nm').value.trim(),country:c[0],family:fam});
    const lines=[
      ['bok','Bok!','¡Hola!'],
      ['zovem-se',`Zovem se ${name}.`,`Me llamo ${name}.`],
      [c[2],`Ja sam iz ${c[1]}.`,`Soy de ${c[0]}.`],
      fam==='none' ? ['volim-hrvatsku','Volim Hrvatsku!','¡Me encanta Croacia!'] : [fam, fam==='djed'?'Moj djed je iz Hrvatske.':'Moja baka je iz Hrvatske.', fam==='djed'?'Mi abuelo es de Croacia.':'Mi abuela es de Croacia.'],
      ['govorim-malo','Govorim malo hrvatski.','Hablo un poco de croata.'],
      ['drago-mi-je','Drago mi je!','¡Mucho gusto!']
    ];
    $('#pres').innerHTML = lines.map(l=>`<p class="l"><button type="button" data-a="${l[0]}" aria-label="Escuchar">🔊</button><span><b lang="hr">${esc(l[1])}</b><small>${esc(l[2])}</small></span></p>`).join('')
      + `<p style="color:var(--soft);font-size:.9rem;margin:8px 0 0">💡 En "Zovem se…", di tu nombre en voz alta después del audio.</p>`;
    $('#pres').querySelectorAll('button').forEach(b=>b.onclick=()=>play(b.dataset.a,b));
    $('#all').onclick=()=>{ playSeq(lines.map(l=>l[0])); if(!done.me){ addStar(3); finish('me'); confetti(); } };
  };
  ['nm','ct','fm'].forEach(id=>$('#'+id).addEventListener('input',draw));
  $('#ct').addEventListener('change',draw); $('#fm').addEventListener('change',draw);
  draw();
}

function endScreen(msg, got, nextId){
  confetti();
  const next=GAMES.find(g=>g.id===nextId);
  view.innerHTML = `
    <div class="end">
      <div class="medal" aria-hidden="true">🏅</div>
      <h2 style="font-size:1.8rem;margin-top:6px">Bravo!</h2>
      <p style="font-size:1.15rem">${esc(msg)} · +${got} ⭐</p>
      <div class="row">
        ${next?`<button class="big" id="nx" type="button">${next.ic} ${esc(next.t.replace(/^\d\.\s*/,''))} →</button>`:''}
        <button class="big ghost" id="mn" type="button">Menú</button>
      </div>
    </div>
    <div class="cta">
      <b style="font-family:var(--display);font-size:1.15rem">▶️ ¿Quieres aprender más?</b>
      <p>Mira las clases gratis de croata en español en YouTube.</p>
      <a class="big" href="https://www.youtube.com/@croacia_lovers?sub_confirmation=1" target="_blank" rel="noopener">Ver clases en YouTube</a>
    </div>`;
  if(next) $('#nx').onclick=()=>go(next.id);
  $('#mn').onclick=()=>go('home');
}

go('home');
if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
