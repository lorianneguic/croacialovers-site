*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#f3faff;font-family:Nunito,system-ui,sans-serif;color:var(--navy)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 40px}
header{background:linear-gradient(160deg,#dff3fd,#a9dcf7);border-radius:0 0 26px 26px;padding:18px 16px 16px;position:relative;overflow:hidden;min-height:118px}
header .k{font-weight:800;font-size:12px;letter-spacing:.14em;color:#3e7fae}
header h1{font-family:'Baloo 2';font-weight:800;font-size:30px;line-height:1.05}
header h2{font-family:'Baloo 2';font-weight:800;font-size:19px;color:var(--red);line-height:1.1}
header img{position:absolute;right:6px;bottom:0;height:116px}
header .back{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:99px;padding:4px 12px;font-weight:800;font-size:14px;margin-top:8px;box-shadow:0 2px 0 #b7dbef}
.sec{font-weight:800;font-size:13px;letter-spacing:.12em;color:var(--red);margin:22px 4px 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}

.tile:active{transform:scale(.97)}
.tile .i{font-size:34px;line-height:1.2}
.tile .n{font-family:'Baloo 2';font-weight:800;font-size:17px;line-height:1.1;margin-top:4px}
.tile .c{font-size:12px;font-weight:700;color:var(--ink);margin-top:2px}
.tile .st{font-size:12px;margin-top:4px;color:var(--ok);font-weight:800;min-height:16px}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px}
.mode{background:#fff;border:2px solid var(--line);border-radius:18px;padding:16px 8px;text-align:center}

.bar{display:flex;align-items:center;gap:10px;margin:16px 2px 12px;font-weight:800}
.prog{flex:1;height:12px;background:#e3f2fb;border-radius:99px;overflow:hidden}.prog i{display:block;height:100%;background:var(--sky);border-radius:99px;transition:width .3s}
.card{background:#fff;border:2px solid var(--line);border-radius:22px;padding:18px;text-align:center;box-shadow:0 3px 10px rgba(19,48,107,.08)}
.pic{height:150px;display:flex;align-items:center;justify-content:center;margin-bottom:6px}
.pic img{max-height:150px;max-width:100%;border-radius:12px}
.pic .e{font-size:92px;line-height:1}
.pic .num{font-family:'Baloo 2';font-weight:800;font-size:96px;color:var(--red);line-height:1}
.q{font-family:'Baloo 2';font-weight:800;font-size:24px;line-height:1.2;margin:4px 0 2px}
.q .bl{display:inline-block;min-width:70px;border-bottom:3px dashed var(--sky);color:var(--red)}
.hint{font-weight:700;color:var(--ink);font-size:15px}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{background:#fff;border:2.5px solid var(--line);border-radius:16px;padding:13px;font-family:'Baloo 2';font-weight:800;font-size:21px;box-shadow:0 3px 0 #d6ecf8}
.opt.ok{background:#dff6e4;border-color:#86d39a;color:var(--ok)}
.opt.bad{background:#ffe3ea;border-color:#f29bb0;color:var(--bad)}
.fb{min-height:28px;margin-top:12px;font-weight:800;font-size:17px}
.next{margin-top:10px;background:var(--red);color:#fff;border-radius:99px;padding:12px 30px;font-weight:800;font-size:18px;box-shadow:0 4px 0 #b8344a}
.flip{perspective:900px;cursor:pointer}
.flip .in{position:relative;min-height:300px;transition:transform .45s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center}
.flip .b{transform:rotateY(180deg)}
.big{font-family:'Baloo 2';font-weight:800;font-size:34px;line-height:1.1}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}
@media(min-width:560px){.mem{grid-template-columns:repeat(4,1fr)}}
.mc{aspect-ratio:1;border-radius:16px;background:var(--sky);color:#fff;font-size:34px;font-family:'Baloo 2';font-weight:800;display:flex;align-items:center;justify-content:center;padding:6px;box-shadow:0 3px 0 #2f8fc0;transition:transform .2s}
.mc.open,.mc.done{background:#fff;border:2.5px solid var(--line);color:var(--navy);box-shadow:none}
.mc.done{border-color:#86d39a;background:#f0fbf3}
.mc img{max-width:100%;max-height:100%;border-radius:8px}
.mc .w{font-size:17px;line-height:1.05;word-break:break-word}
.mc .e{font-size:44px}
.spk{display:inline-flex;align-items:center;justify-content:center;width:52px;height:52px;border-radius:50%;background:var(--sky);color:#fff;font-size:24px;box-shadow:0 3px 0 #2f8fc0;margin-top:10px}
.end{text-align:center}
.end img{height:170px}
.end .score{font-family:'Baloo 2';font-weight:800;font-size:44px;color:var(--red)}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.ghost{background:#fff;border:2px solid var(--line);border-radius:99px;padding:10px 22px;font-weight:800}
.intro{background:var(--cream);border-radius:16px;padding:12px 14px;font-weight:700;font-size:15px;line-height:1.45;margin-top:14px}
footer{text-align:center;margin-top:30px;font-weight:800;font-size:13px;color:#3e7fae}
</style>

"nije", ["nisam", "niste"], "c264be8a7b"], ["Mi ___ studenti.", "nismo", ["niste", "nisu"], "f8ceaf88f9"], ["Vi ___ iz Perua.", "niste", ["nismo", "nije"], "4902e9e9ab"], ["Oni ___ prijatelji.", "nisu", ["nije", "nismo"], "dd0b9820d6"], ["Boby ___ mačka. 🐶", "nije", ["nisu", "nisam"], "e084538a3a"], ["One ___ profesorice.", "nisu", ["nije", "niste"], "ebe60f4e43"]]}, {"id": "plu", "t": "El plural", "ic": "🔁", "help": "Elige el plural correcto.", "q": [["brod (barco)", "brodovi", ["brodi", "brode"], "8e921a1d7b"], ["kuća (casa)", "kuće", ["kući", "kućovi"], "65abea8c5c"], ["more (mar)", "mora", ["mori", "more"], "addec42693"], ["mačka (gata)", "mačke", ["mački", "mačkovi"], "5845251b2c"], ["prozor (ventana)", "prozori", ["prozore", "prozorovi"], "aa94adb975"], ["vlak (tren)", "vlakovi", ["vlaki", "vlake"], "9db75ba729"], ["pas (perro)", "psi", ["pasovi", "pasi"], "cd0acfe085"], ["dijete (niño)", "djeca", ["dijeti", "djete"], "bc3c4994fe"], ["čovjek (persona)", "ljudi", ["čovjeki", "čovjeci"], "8d68ae8d01"], ["otok (isla)", "otoci", ["otoki", "otokovi"], "4394e6ff1f"], ["selo (pueblo)", "sela", ["seli", "selovi"], "1621cc04cf"], ["miš (ratón)", "miševi", ["mišovi", "miši"], "a1816a94e9"], ["ključ (llave)", "ključevi", ["ključovi", "ključi"], "50bb9435af"], ["žena (mujer)", "žene", ["ženi", "ženovi"], "291fae44be"], ["jabuka (manzana)", "jabuke", ["jabuki", "jabukovi"], "da5c2d1ac8"], ["kazalište (teatro)", "kazališta", ["kazališti", "kazalištevi"], "010b1c4ede"], ["Amerikanac (americano)", "Amerikanci", ["Amerikanaci", "Amerikanacovi"], "8ea72a5022"], ["grad (ciudad)", "gradovi", ["gradi", "grade"], "e37b6e74a3"]]}, {"id": "pos", "t": "Posesivos: moj, tvoj…", "ic": "🔑", "help": "Mira de quién es y el género de la palabra.", "q": [["(ja) ___ brat", "moj", ["moja", "moje"], "e43fb62538"], ["(ja) ___ sestra", "moja", ["moj", "moje"], "cfbb92d3fd"], ["(ja) ___ more", "moje", ["moj", "moja"], "927b955332"], ["(ti) ___ mama", "tvoja", ["tvoj", "tvoje"], "738d49b376"], ["(ti) ___ tata", "tvoj", ["tvoja", "tvoje"], "0436060284"], ["(mi) ___ kuća", "naša", ["naš", "naše"], "59ed785be3"], ["(vi) ___ grad", "vaš", ["vaša", "vaše"], "aa237d5245"], ["(on) ___ baka", "njegova", ["njezina", "njegov"], "68dd8fcb0c"], ["(ona) ___ djed", "njezin", ["njegov", "njezina"], "e0653ce5b3"], ["(oni) ___ dijete", "njihovo", ["njihov", "njihova"], "3a7b1ac7e0"], ["(ja) ___ roditelji", "moji", ["moje", "moj"], "384217a8e1"], ["(ja) ___ sestre", "moje", ["moji", "moja"], "e5b00ae1a2"]]}, {"id": "ovo", "t": "Što je ovo? Tko je ovo?", "ic": "👉", "help": "Tko para personas, Što para cosas. Je para uno, su para varios.", "q": [["___ je ovo? — Ovo je mama. 👩", "Tko", ["Što", "Gdje"], "e91436a266"], ["___ je ovo? — Ovo je kava. ☕", "Što", ["Tko", "Kako"], "16485915c0"], ["___ je ovo? — Ovo je moj brat. 👦", "Tko", ["Što", "Odakle"], "4856aa0f29"], ["___ je ovo? — Ovo je ključ. 🔑", "Što", ["Tko", "Koliko"], "556f1c9fc7"], ["Ovo ___ jabuka. 🍎", "je", ["su", "si"], "0cfa7a082b"], ["Ovo ___ jabuke. 🍎🍎", "su", ["je", "smo"], "b7942b0f15"], ["Ovo ___ vrata. 🚪", "su", ["je", "ste"], "240df223e5"], ["Ovo ___ moji roditelji. 👫", "su", ["je", "smo"], "2fd5b0411c"], ["Ovo ___ moja sestra. 👧", "je", ["su", "sam"], "6f630d4f65"], ["___ si? — Iz Argentine.", "Odakle", ["Kako", "Tko"], "183422c204"], ["___ si? — Dobro sam, hvala.", "Kako", ["Gdje", "Što"], "476c62e245"], ["___ košta? — Pet eura.", "Koliko", ["Kako", "Tko"], "9fb7549380"]]}];
const app=document.getElementById('app');
const AU=new Audio();const say=k=>{if(!k)return;try{AU.pause();AU.src='audio/'+k+'.mp3';AU.play().catch(()=>{})}catch(e){}};
const spk=k=>`<button class="spk" onclick="event.stopPropagation();say('${k}')" aria-label="Escuchar">🔊</button>`;
const sh=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const store={get(k){try{return JSON.parse(localStorage.getItem('cl1_'+k))}catch(e){return null}},set(k,v){try{localStorage.setItem('cl1_'+k,JSON.stringify(v))}catch(e){}}};
const pic=(w,big)=>w.img?`<img src="${w.img}" alt="">`:(/^\d+$/.test(w.e)?`<span class="num">${w.e}</span>`:`<span class="e">${w.e}</span>`);
function head(t2,mona,back){return `<header><div class="k">APRENDE CROATA FÁCIL · CAPÍTULO 1</div><h1>${t2?t2.h:'Igrajmo se!'}</h1><h2>${t2?t2.s:'¡Juguemos y practiquemos!'}</h2>${back?`<button class="back" onclick="${back}">← Volver</button>`:''}<img src="img/${mona||'mona.png'}" alt=""></header>`}
function best(id){const b=store.get('best_'+id);return b?`⭐ ${b}`:''}

function home(){
  app.innerHTML=`<div class="wrap">${head()}
  <div class="intro">🎁 ¡Hola! Esta página es un regalo para ti, que tienes el libro <b>Aprende Croata fácil</b>. Elige un tema y juega. Toca 🔊 para escuchar cómo se pronuncia. ¡Repite las veces que quieras!</div>
  <div class="sec">📚 VOCABULARIO</div><div class="grid">${V.map(t=>`<button class="tile" onclick="topic('${t.id}')"><div class="i">${t.ic}</div><div class="n">${t.t}</div><div class="c">${t.w.length} palabras</div><div class="st">${best(t.id)}</div></button>`).join('')}</div>
  <div class="sec">🎧 AFINA EL OÍDO</div><div class="grid">${L.map(t=>`<button class="tile" onclick="quizL('${t.id}')"><div class="i">${t.ic}</div><div class="n">${t.t}</div><div class="c">Escucha y elige</div><div class="st">${best(t.id)}</div></button>`).join('')}</div>
  <div class="sec">🧠 GRAMÁTICA</div><div class="grid">${G.map(t=>`<button class="tile" onclick="quizG('${t.id}')"><div class="i">${t.ic}</div><div class="n">${t.t}</div><div class="c">${t.q.length} preguntas</div><div class="st">${best(t.id)}</div></button>`).join('')}</div>
  <footer>croacialovers.com · ¡Sretno! 🍀</footer></div>`;scrollTo(0,0)}

function topic(id){const t=V.find(x=>x.id==id);
  app.innerHTML=`<div class="wrap">${head({h:t.ic+' '+t.t,s:'Elige cómo quieres practicar'},'mona_piensa.png','home()')}
  <div class="modes">
   <button class="mode" onclick="cards('${id}')"><div class="i">🃏</div><div class="n">Tarjetas</div><div class="c">Mira y aprende</div></button>
   <button class="mode" onclick="quizV('${id}')"><div class="i">✅</div><div class="n">Quiz</div><div class="c">¿Cómo se dice?</div></button>
   <button class="mode" onclick="memo('${id}')"><div class="i">🧩</div><div class="n">Memorice</div><div class="c">Une imagen y palabra</div></button>
  </div><div class="intro">💡 Empieza con las <b>Tarjetas</b>: toca cada una para ver qué significa. Después prueba el <b>Quiz</b> y el <b>Memorice</b>.</div></div>`;scrollTo(0,0)}

function cards(id){const t=V.find(x=>x.id==id);let i=0;
  const draw=()=>{const w=t.w[i];app.innerHTML=`<div class="wrap">${head({h:t.ic+' '+t.t,s:'Tarjetas'},'mona.png',`topic('${id}')`)}
  <div class="bar"><span>${i+1}/${t.w.length}</span><div class="prog"><i style="width:${(i+1)/t.w.length*100}%"></i></div></div>
  <div class="card flip" id="fc" onclick="this.classList.toggle('on')"><div class="in">
   <div class="f"><div class="pic">${pic(w)}</div><div class="big">${w.L?`<span style="color:var(--red)">${w.L}</span> · `:''}${w.hr}</div>${spk(w.a)}<div class="hint" style="margin-top:8px">👆 Toca la tarjeta para ver el significado</div></div>
   <div class="b"><div class="pic">${pic(w)}</div><div class="big" style="color:var(--red)">${w.es}</div><div class="hint" style="margin-top:6px">${w.hr}</div>${spk(w.a)}</div></div></div>
  <div class="row"><button class="ghost" onclick="cardsGo(-1)">← Anterior</button><button class="next" onclick="cardsGo(1)">Siguiente →</button></div></div>`};
  window.cardsGo=d=>{i=(i+d+t.w.length)%t.w.length;draw();say(t.w[i].a)};draw();say(t.w[0].a)}

function run(title,id,items,mona){let i=0,ok=0;
  const draw=()=>{const it=items[i];
   app.innerHTML=`<div class="wrap">${head(title,mona,title.back)}
   <div class="bar"><span>${i+1}/${items.length}</span><div class="prog"><i style="width:${i/items.length*100}%"></i></div><span>✅ ${ok}</span></div>
   <div class="card">${it.top}<div class="opts">${it.opts.map(o=>`<button class="opt" data-o="${encodeURIComponent(o)}">${o}</button>`).join('')}</div><div class="fb" id="fb"></div><div id="nx"></div></div></div>`;
   if(it.auto)setTimeout(()=>say(it.au),350);
   app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(app.querySelector('.opt.ok,.opt.bad'))return;const o=decodeURIComponent(b.dataset.o),good=o==it.ans;
     if(good){ok++;b.classList.add('ok');fb.innerHTML='🎉 ¡Bravo! Točno!'+(it.es?`<br><small>${it.es}</small>`:'')}else{b.classList.add('bad');app.querySelectorAll('.opt').forEach(x=>{if(decodeURIComponent(x.dataset.o)==it.ans)x.classList.add('ok')});fb.innerHTML=`😕 Casi… es <b>${it.ans}</b>`+(it.es?`<br><small>${it.es}</small>`:'')}
     say(it.au);nx.innerHTML=`<button class="ghost" onclick="say('${it.au}')">🔊 Escuchar</button> <button class="next" onclick="runNext()">${i+1<items.length?'Siguiente →':'Ver resultado'}</button>`});
  };
  window.runNext=()=>{i++;i<items.length?draw():finish(title,id,ok,items.length)};draw()}
function finish(title,id,ok,n){const p=Math.round(ok/n*100);const prev=store.get('best_'+id);if(!prev||ok/n>parseInt(prev)/100)store.set('best_'+id,p+'%');
  const msg=p>=90?'Odlično! 🌟 ¡Lo sabes muy bien!':p>=60?'Dobro! 👍 ¡Vas muy bien!':'¡Sigue practicando! 💪 Polako…';
  app.innerHTML=`<div class="wrap">${head(title,'mona_ok.png',title.back)}<div class="card end" style="margin-top:16px"><img src="img/mona_ok.png" alt=""><div class="score">${ok} / ${n}</div><div class="q">${msg}</div>
  <div class="row"><button class="next" onclick="${title.again}">🔄 Otra vez</button><button class="ghost" onclick="home()">🏠 Inicio</button></div></div></div>`;scrollTo(0,0)}

function quizV(id){const t=V.find(x=>x.id==id);const ws=sh(t.w).slice(0,Math.min(10,t.w.length));
  const items=ws.map(w=>{const others=sh(t.w.filter(x=>x.hr!=w.hr)).slice(0,2).map(x=>x.hr);
    return {au:w.a,top:`<div class="pic">${pic(w)}</div><div class="q">¿Cómo se dice <span style="color:var(--red)">"${w.es}"</span>?</div>`,ans:w.hr,opts:sh([w.hr,...others])}});
  run({h:t.ic+' '+t.t,s:'Quiz',back:`topic('${id}')`,again:`quizV('${id}')`},id,items,'mona_piensa.png')}

function quizG(id){const g=G.find(x=>x.id==id);const qs=sh(g.q).slice(0,10);
  const items=qs.map(([q,a,w,au])=>({au,top:`<div class="hint">${g.help}</div><div class="q" style="margin-top:12px">${q.replace('___','<span class="bl">&nbsp;?&nbsp;</span>')}</div>`,ans:a,opts:sh([a,...w])}));
  run({h:g.ic+' '+g.t,s:'¡A practicar!',back:'home()',again:`quizG('${id}')`},id,items,'mona_piensa.png')}

function quizL(id){const g=L.find(x=>x.id==id);const qs=sh(g.q).slice(0,10);
  const items=qs.map(([a,w,es,au])=>({au,es,auto:1,top:`<div class="hint">🎧 Escucha con atención y elige lo que oyes. Puedes escuchar las veces que quieras.</div><button class="spk" style="width:84px;height:84px;font-size:38px;margin:14px auto 4px;display:flex" onclick="say('${au}')" aria-label="Escuchar">🔊</button>`,ans:a,opts:sh([a,...w])}));
  run({h:g.ic+' '+g.t,s:'Afina el oído',back:'home()',again:`quizL('${id}')`},id,items,'mona_piensa.png')}

function memo(id){const t=V.find(x=>x.id==id);const ws=sh(t.w).slice(0,6);let open=[],done=0,tries=0;
  const cs=sh(ws.flatMap((w,k)=>[{k,kind:'p',w},{k,kind:'t',w}]));
  const draw=()=>{app.innerHTML=`<div class="wrap">${head({h:t.ic+' '+t.t,s:'Memorice'},'mona_piensa.png',`topic('${id}')`)}
   <div class="bar"><span>Une cada imagen con su palabra</span><div style="flex:1"></div><span>🔁 ${tries}</span></div>
   <div class="mem">${cs.map((c,i)=>`<button class="mc ${c.done?'done':c.open?'open':''}" onclick="memoTap(${i})">${c.open||c.done?(c.kind=='p'?pic(c.w):`<span class="w">${c.w.hr}</span>`):'?'}</button>`).join('')}</div></div>`};
  window.memoTap=i=>{const c=cs[i];if(c.open||c.done||open.length==2)return;c.open=true;open.push(c);draw();if(c.kind=='t')say(c.w.a);
    if(open.length==2){tries++;setTimeout(()=>{const[a,b]=open;if(a.k==b.k&&a.kind!=b.kind){a.done=b.done=true;done++;say(a.w.a)}a.open=b.open=false;open=[];draw();
      if(done==ws.length)setTimeout(()=>finishMemo(),400)},700)}};
  const finishMemo=()=>{app.innerHTML=`<div class="wrap">${head({h:t.ic+' '+t.t,s:'Memorice'},'mona_ok.png',`topic('${id}')`)}<div class="card end" style="margin-top:16px"><img src="img/mona_ok.png" alt=""><div class="score">¡Bravo!</div><div class="q">Lo lograste en ${tries} intentos 🎉</div>
   <div class="row"><button class="next" onclick="memo('${id}')">🔄 Otra vez</button><button class="ghost" onclick="topic('${id}')">← Volver</button></div></div></div>`};
  draw()}
home();
</script>
</body>
